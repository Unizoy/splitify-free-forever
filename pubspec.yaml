name: splitify
description: "Splitify Free Forever - free, open-source expense splitting for India."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter: {sdk: flutter}
  flutter_localizations: {sdk: flutter}
  supabase_flutter: ^2.18.3
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  go_router: ^18.1.4
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  uuid: ^4.6.0
  connectivity_plus: ^7.3.2
  workmanager: ^0.10.10
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter_local_notifications: ^23.0.3
  google_sign_in: ^7.2.0
  image_picker: ^1.2.4
  # S-110: set useAndroidPhotoPicker (Android photo picker, no storage permission); same federated plugin.
  image_picker_android: ^0.8.13+25
  image_picker_platform_interface: ^2.11.2
  flutter_image_compress: ^2.5.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  csv: ^8.0.0
  file_picker: ^13.4.0
  path_provider: ^2.1.6
  fl_chart: ^1.3.1
  intl: ^0.20.3
  decimal: ^3.2.6
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  home_widget: ^0.10.0
  logging: ^1.3.0
  shared_preferences: ^2.5.6
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test: {sdk: flutter}
  integration_test: {sdk: flutter}
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  riverpod_generator: ^4.0.10
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  alchemist: ^0.15.0
  glados: ^1.1.7
  patrol: ^4.11.0
  very_good_analysis: ^11.0.0
  riverpod_lint: ^3.2.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/LICENSES/
  fonts:
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor-Regular.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/Phosphor-Bold.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
