name: Bug report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search existing issues first.
        For security problems, do not use this form. See SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Tap ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - Web
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device / browser and app version
      placeholder: e.g. Pixel 9, Android 16, app v0.1.0
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Optional. Remove any personal data first.
