name: CI

on:
  push:
    branches: ['phase/**', main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --no-fatal-infos
      - run: dart run tool/guards.dart
      - run: flutter test --coverage --exclude-tags device,needs-owner,quarantine
      - run: dart run tool/coverage_check.dart
      - run: flutter build apk --debug --dart-define-from-file=secrets/env.example.json
