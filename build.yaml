targets:
  $default:
    builders:
      json_serializable:
        options:
          explicit_to_json: true
      drift_dev:
        options:
          store_date_time_values_as_text: true
          use_sql_column_name_as_json_key: true
          databases:
            app: lib/data/local/app_database.dart
          schema_dir: drift_schemas/
          sql:
            dialect: sqlite
            options:
              version: "3.45"
              modules: [fts5]
