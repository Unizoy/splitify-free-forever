# Launch splash (planning/06-design-system.md §8): the mark on the welcome screen's top colour
# (AppColors.light.heroTop), the same in light and dark mode, so splash -> welcome is seamless (S-286).
# Regenerate: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#6E70B0"
  color_dark: "#6E70B0"
  image: assets/brand/splash.png
  image_dark: assets/brand/splash.png
  android_12:
    image: assets/brand/splash_android12.png
    image_dark: assets/brand/splash_android12.png
    color: "#6E70B0"
    color_dark: "#6E70B0"
  ios: false
  web: false
